<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aftermath College Game Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b1020; --bg2:#121a30; --card:#ffffff; --ink:#0e1526; --muted:#6b7488;
    --line:#e7ebf3; --live:#e11d48; --good:#16a34a; --warn:#d97706; --chip:#f1f4fa;
    --shadow:0 6px 20px rgba(9,14,30,.10);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; }
  body {
    background:linear-gradient(180deg,#0b1020 0,#0b1020 220px,#eef1f7 220px,#eef1f7 100%);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .wrap { max-width:1120px; margin:0 auto; padding:0 16px 48px; }

  /* header */
  header { padding:22px 4px 16px; color:#fff; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand h1 { margin:0; font-family:"Saira Condensed","Oswald",sans-serif; font-size:40px; font-weight:800;
    letter-spacing:.6px; text-transform:uppercase; line-height:.95;
    background:linear-gradient(92deg,#ff6a1a 0%,#ffd200 38%,#22c55e 68%,#38bdf8 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand .ball { font-size:26px; }
  .logo-img { height:78px; width:78px; border-radius:12px; flex:0 0 auto; object-fit:cover;
    box-shadow:0 2px 10px rgba(0,0,0,.45); }
  @media (max-width:560px){ .logo-img{ height:60px; width:60px; } }
  .sub { margin:6px 0 0 2px; color:#9fb0d0; font-size:14px; font-weight:500; }
  .livecount { margin-left:auto; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18);
    color:#fff; padding:7px 13px; border-radius:999px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--live); box-shadow:0 0 0 0 rgba(225,29,72,.6); animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(225,29,72,.55)} 70%{box-shadow:0 0 0 8px rgba(225,29,72,0)} 100%{box-shadow:0 0 0 0 rgba(225,29,72,0)} }

  /* tabs */
  nav { display:flex; gap:6px; background:rgba(255,255,255,.12); padding:5px; border-radius:14px;
    width:fit-content; margin:2px auto 20px; box-shadow:var(--shadow); }
  nav button { border:0; background:transparent; color:#cdd8ee; font-size:14px; font-weight:700;
    padding:9px 18px; border-radius:10px; cursor:pointer; transition:.15s; }
  nav button.active { background:#fff; color:var(--ink); }

  /* cards grid */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px; }
  .game { background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden;
    border:1px solid var(--line); display:flex; flex-direction:column; }
  .game .stripe { height:6px; width:100%; }
  .game .top { display:flex; align-items:center; gap:8px; padding:11px 14px 4px; }
  .badge-live { background:var(--live); color:#fff; font-size:11px; font-weight:800; letter-spacing:.4px;
    padding:3px 8px; border-radius:6px; display:flex; align-items:center; gap:5px; }
  .badge-live .d { width:6px; height:6px; border-radius:50%; background:#fff; animation:pulse 1.5s infinite; }
  .badge-final { background:#0e1526; color:#fff; font-size:11px; font-weight:800; letter-spacing:.4px; padding:3px 8px; border-radius:6px; }
  .eyes { margin-left:auto; color:var(--muted); font-size:13px; font-weight:600; }

  /* matchup rows */
  .rows { padding:6px 14px 4px; }
  .team { display:flex; align-items:center; gap:11px; padding:8px 0; }
  .team + .team { border-top:1px solid var(--line); }
  .logo { width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-family:"Saira Condensed","Oswald",sans-serif; font-size:14px; font-weight:800; color:#fff; flex:0 0 auto;
    letter-spacing:.5px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.15); }
  .tname { font-family:"Oswald",sans-serif; font-weight:600; font-size:17px; line-height:1.1; letter-spacing:.2px; }
  .tsub { color:var(--muted); font-size:12px; font-weight:500; }
  .rank { color:var(--muted); font-size:12px; font-weight:800; margin-right:4px; vertical-align:1px; }
  .rec { color:var(--muted); font-size:12px; font-weight:600; }
  .score { margin-left:auto; font-family:"Saira Condensed","Oswald",sans-serif; font-size:34px; font-weight:800;
    letter-spacing:0; font-variant-numeric:tabular-nums; }
  @keyframes scoreflash { 0%{box-shadow:0 0 0 3px var(--live), var(--shadow);} 60%{box-shadow:0 0 0 3px var(--live), var(--shadow);} 100%{box-shadow:var(--shadow);} }
  .game.changed { animation:scoreflash 2.2s ease-out; }
  .soundbtn { background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18); color:#fff; cursor:pointer;
    border-radius:999px; padding:7px 12px; font-size:12px; font-weight:600; }
  .clearrow { display:flex; justify-content:flex-end; margin-top:22px; }
  .clearall { background:#fff; border:1px solid var(--live); color:var(--live); font-weight:700; font-size:13px;
    padding:9px 15px; border-radius:10px; cursor:pointer; }
  .clearall:hover { background:var(--live); color:#fff; }
  .team.lead .score { color:var(--ink); }
  .team.trail { opacity:.62; }

  /* status bar */
  .status { display:flex; align-items:center; gap:8px; padding:10px 14px; margin-top:2px;
    background:var(--chip); font-size:13px; font-weight:700; color:var(--ink); }
  .status .q { color:var(--live); }
  .status .clk { font-variant-numeric:tabular-nums; }
  .status .dd { color:var(--ink); background:#e6ebf5; padding:1px 7px; border-radius:6px; font-size:12px; }
  .status .src { margin-left:auto; font-size:11px; font-weight:600; color:var(--muted); }
  .status .src.manual { color:var(--good); }
  .status .src.stale { color:var(--warn); }
  .poss { font-size:13px; margin-left:5px; vertical-align:1px; }

  /* red zone (goal-to-go) treatment */
  .rz-badge { background:var(--live); color:#fff; font-size:10px; font-weight:800; letter-spacing:.4px;
    padding:3px 7px; border-radius:6px; }
  .game.redzone { border-color:var(--live); box-shadow:0 0 0 2px rgba(225,29,72,.35), var(--shadow); }
  .game.redzone .status { background:#fdecef; }

  /* alert toasts (halftime, 4th qtr, 2-min, close game) */
  #toasts { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:50;
    display:flex; flex-direction:column; gap:8px; align-items:center; width:calc(100% - 24px); max-width:420px; }
  .toast { background:#0e1526; color:#fff; border-radius:12px; padding:11px 16px; box-shadow:0 10px 30px rgba(9,14,30,.35);
    display:flex; align-items:center; gap:10px; width:100%; animation:toastin .28s ease-out; border:1px solid rgba(255,255,255,.12); }
  .toast.close { background:linear-gradient(92deg,#e11d48,#b91c1c); }
  .toast .tt { font-weight:800; font-size:14px; }
  .toast .ts { color:#cdd8ee; font-size:12px; font-weight:600; }
  .toast.close .ts { color:#ffe4e6; }
  @keyframes toastin { from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  .toast.fade { opacity:0; transition:opacity .5s ease; }

  /* single-stream (no score) body */
  .solo { padding:12px 14px 4px; }
  .solo .coach { font-weight:800; font-size:17px; }
  .solo .title { color:var(--muted); font-size:13px; margin-top:3px; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .solo .await { margin-top:9px; font-size:12px; color:var(--muted); font-weight:600; }

  /* footer */
  .foot { display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--line); margin-top:auto; }
  .who { font-size:12.5px; color:var(--ink); font-weight:700; }
  .who-sub { display:block; font-size:11.5px; color:var(--muted); font-weight:600; margin-top:1px; }
  .btns { margin-left:auto; display:flex; gap:8px; }
  .watch { background:#9146FF; color:#fff; border:0; text-decoration:none; font-size:12.5px; font-weight:700;
    padding:8px 13px; border-radius:9px; display:inline-flex; align-items:center; gap:6px; }
  .edit { background:#fff; border:1px solid var(--line); color:var(--muted); font-size:12.5px; font-weight:700;
    padding:8px 11px; border-radius:9px; cursor:pointer; }
  .edit:hover { color:var(--ink); }

  /* off-dynasty card */
  .game.off { opacity:.7; }
  .game.off .stripe { background:#c3cad8 !important; }

  /* empty / section titles */
  .section-note { color:var(--muted); font-size:13.5px; font-weight:600; margin:0 2px 14px; }
  .empty { background:#fff; border-radius:16px; box-shadow:var(--shadow); padding:46px 20px; text-align:center;
    color:var(--muted); }
  .empty .big { font-size:44px; }
  .empty h3 { color:var(--ink); margin:10px 0 4px; }

  /* standings table */
  .panel { background:#fff; border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th,td { padding:13px 14px; text-align:left; font-size:14px; }
  thead th { background:#f7f9fc; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  tbody tr { border-top:1px solid var(--line); }
  .rankcell { display:flex; align-items:center; gap:11px; }
  .played { color:var(--good); font-weight:700; }
  .notyet { color:var(--muted); font-weight:600; }
  .bar { height:8px; background:#eef1f7; border-radius:99px; overflow:hidden; width:110px; }
  .bar > span { display:block; height:100%; border-radius:99px; }

  /* schedule */
  .mrow { background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:11px;
    display:flex; align-items:center; gap:12px; }
  .mside { display:flex; align-items:center; gap:10px; flex:1; }
  .mside.r { justify-content:flex-end; }
  .mvs { color:var(--muted); font-weight:800; font-size:12px; }
  .pill { font-size:11px; font-weight:800; padding:5px 10px; border-radius:999px; }
  .pill.done { background:#e7f7ee; color:var(--good); }
  .pill.wait { background:#f1f4fa; color:var(--muted); }

  .updated { text-align:center; color:#8a94aa; font-size:12px; margin-top:22px; }
  @media (max-width:560px){ .brand h1{font-size:22px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="toasts"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <img class="logo-img" src="/aftermath_logo.png" alt="The Aftermath CFB 27" />

        <h1>College Gameday Live</h1>
        <div class="sub" id="sub">Loading…</div>
      </div>

      <span class="livecount" id="livecount"><span class="dot"></span> …</span>
    </div>
    <nav>
      <button data-tab="live" class="active">Live</button>
      <button data-tab="final">Final</button>
    </nav>
  </header>

  <section id="live"></section>
  <section id="final" hidden></section>

  <div class="updated" id="updated"></div>
</div>

const fmtAgo = iso => {

  if(m<1) return "just now"; if(m<60) return m+"m ago";
  const h=Math.floor(m/60); return h+"h "+(m%60)+"m ago";
};
const liveLen = iso => { if(!iso) return ""; const m=Math.round((Date.now()-new Date(iso))/60000);
  return m<60? m+"m": Math.floor(m/60)+"h "+(m%60)+"m"; };
// fine-grained freshness for the per-card "reading age" stamp
const fmtFresh = iso => { if(!iso) return ""; const s=Math.round((Date.now()-new Date(iso))/1000);
  if(s<10) return "just now"; if(s<60) return s+"s ago"; const m=Math.floor(s/60);
  return m<60? m+"m ago": Math.floor(m/60)+"h ago"; };

// shared status bar: quarter · clock · down&distance, then source + freshness
function statusHtml(sc){
  const dd = sc.downDistance ? `<span class="dd">${esc(sc.downDistance)}</span>` : "";
  const stat = [sc.quarter?`<span class="q">${esc(sc.quarter)}</span>`:"",
                sc.clock?`<span class="clk">${esc(sc.clock)}</span>`:"", dd]
                .filter(Boolean).join(" · ") || "LIVE";
  const srcCls = sc.stale?"src stale":(sc.source==="manual"?"src manual":"src");
  const base = sc.stale?"reading stale":(sc.source==="manual"?"entered":"auto");
  const srcTxt = sc.updatedAt ? `${base} · ${fmtFresh(sc.updatedAt)}` : base;
  return `${stat}<span class="${srcCls}">${srcTxt}</span>`;
}

async function renderLive(){

  $("#sub").textContent = "Live scores and final results";

    ? `<span class="dot"></span> ${onD.length} live`
    : `<span class="dot" style="background:#7a869f"></span> none live`;
  $("#updated").textContent = "Updated "+fmtAgo(d.updatedAt);

  if(!streams.length){
    $("#live").innerHTML = `<div class="empty"><div class="big">😴</div>
      <h3>Nobody's live right now</h3><div>When a coach fires up a stream, their game shows up here.</div></div>`;
    return;
  }
  const sorted=[...streams].sort((a,b)=>(b.onDynasty-a.onDynasty)||((b.score?1:0)-(a.score?1:0))||(b.viewers-a.viewers));
  // group the two streams of a head-to-head into one card
  // Merge the two streams of a head-to-head into one card. Cluster by any SHARED
  // roster team: each roster team belongs to exactly one coach, so if two live
  // streams both show it, they're the same game — robust even if the other team
  // name is garbled on one of them.
  const clusters=[];
  for(const s of sorted){
    const rt = rosterTeams(s);
    let c = rt.length ? clusters.find(cl => rt.some(t => cl.teams.has(t))) : null;
    if(c){ rt.forEach(t=>c.teams.add(t)); c.streams.push(s); }
    else clusters.push({ teams:new Set(rt), streams:[s] });
  }
  const html = clusters.map(c => c.streams.length>=2 ? mergedCard(c.streams) : card(c.streams[0])).join("");
  const games = clusters.length;
  $("#live").innerHTML =
    `<p class="section-note">${onD.length} playing the dynasty${games!==onD.length? ` · ${games} game${games!==1?'s':''}`:""}</p>`
    + `<div class="grid">${html}</div>`;
  flashChanges(sorted);
  checkGameAlerts(sorted);
}

// Roster teams shown on a stream's score bug (each is unique to one coach, so a
// shared one means two streams are the same head-to-head game).
function rosterTeams(s){
  const sc=s.score; if(!sc) return [];
  const out=[];
  for(const raw of [sc.away, sc.home]){ if(!raw) continue; const n=nameFromAbbr(raw); if(n) out.push(normT(n)); }
  return out;
}
// A stable key for a game so two coaches in the same matchup group together.
function gameKey(s){
  const sc=s.score; if(!sc || !sc.away || !sc.home) return null;
  const a=nameFromAbbr(sc.away)||sc.away, b=nameFromAbbr(sc.home)||sc.home;
  return [normT(a),normT(b)].sort().join("|");
}
const liveQuality = s => { const sc=s.score; if(!sc) return -1;
  return (sc.confidence||0) + (sc.awayScore!=null?0.6:0) + (sc.homeScore!=null?0.6:0); };

// One card for a head-to-head, showing the game once with a Watch button per stream.
function mergedCard(group){
  const best = group.slice().sort((a,b)=>liveQuality(b)-liveQuality(a))[0];
  const sc = best.score;

const LAST_SIG = {};
function flashChanges(streams){
  streams.forEach(s=>{
    const sc=s.score; if(!sc || (sc.awayScore==null && sc.homeScore==null)) return;
    const sig = `${sc.awayScore}-${sc.homeScore}`;

let SOUND_ON=true, actx=null;
function unlockAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch{} }
// one short note
function beep(freqs, start, dur, vol){ if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain(); o.type="triangle";
  freqs.forEach((f,i)=>o.frequency.setValueAtTime(f, start + i*(dur/freqs.length)));
  g.gain.setValueAtTime(0.0001,start); g.gain.exponentialRampToValueAtTime(vol||0.3,start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g); g.connect(actx.destination); o.start(start); o.stop(start+dur+0.02);
}
// distinct sound per alert type
function playAlert(type){ if(!SOUND_ON) return; unlockAudio(); if(!actx) return;
  const t=actx.currentTime;
  switch(type){
    case "half":   beep([523],t,0.18); beep([392],t+0.2,0.28); break;                 // two soft descending notes
    case "q4":     beep([659],t,0.14); beep([880],t+0.16,0.22); break;                // rising, brighter
    case "twomin": beep([988],t,0.12); beep([988],t+0.18,0.12); beep([988],t+0.36,0.16); break; // triple tick
    case "close":  beep([880],t,0.12,0.34); beep([1175],t+0.14,0.12,0.34); beep([1568],t+0.28,0.22,0.34); break; // urgent climb
    default:       beep([784,1175],t,0.4); break;                                     // score change
  }
}

const parseClock = c => { if(!c) return null; const m=/^(\d{1,2}):(\d{2})$/.exec(String(c).trim());
  return m ? (+m[1])*60 + (+m[2]) : null; };
const gameLabel = sc => `${nameFromAbbr(sc.away)?abbrOf(nameFromAbbr(sc.away)):(sc.away||"?")} ${sc.awayScore??0} @ ${nameFromAbbr(sc.home)?abbrOf(nameFromAbbr(sc.home)):(sc.home||"?")} ${sc.homeScore??0}`;

// halftime / start-of-4th / 2-minute-warning / close-game-into-4th, fired once per game per event
const ALERT_STATE={};
function checkGameAlerts(streams){
  // collapse a head-to-head to one entry so an alert fires once
  const seen={};
  streams.forEach(s=>{ const sc=s.score; if(!sc) return; const k=gameKey(s)||("solo:"+s.twitch);
    if(!seen[k] || liveQuality(s)>liveQuality(seen[k])) seen[k]=s; });
  for(const k of Object.keys(seen)){
    const sc=seen[k].score, q=sc.quarter||null, secs=parseClock(sc.clock);
    let st=ALERT_STATE[k];
    if(!st){ ALERT_STATE[k]={q, fired:{}}; continue; }  // baseline on first sight — never alert on page load
    const label=gameLabel(sc);
    if(q==="HALF" && st.q!=="HALF" && !st.fired.half){ st.fired.half=1; fireAlert("half","🏈 Halftime", label); }
    if(q==="4TH" && st.q!=="4TH" && !st.fired.q4){
      st.fired.q4=1;
      const known=sc.awayScore!=null && sc.homeScore!=null;
      const margin=Math.abs((sc.awayScore??0)-(sc.homeScore??0));
      if(known && margin<=8) fireAlert("close","🔥 Close game — entering the 4th", `${label} · ${margin===0?"tied":margin+" apart"}`);
      else fireAlert("q4","🏈 4th quarter", label);
    }
    if((q==="2ND"||q==="4TH") && secs!=null && secs<=120){
      const key="twomin_"+q;
      if(!st.fired[key]){ st.fired[key]=1; fireAlert("twomin","⏰ 2-minute warning", `${label} · ${q}`); }
    }
    st.q=q;
  }
}

// Title-case a raw OCR name so a non-roster opponent ("MICHIGAN") shows as a
// clean full name ("Michigan"), matching how roster teams render.
const titleCase = s => (s||"").toString().toLowerCase().replace(/\b[a-z]/g, m => m.toUpperCase());
function teamRow(abbr, tcol, score, lead, poss){
  const name = nameFromAbbr(abbr);
  const opp  = name ? null : resolveOpp(abbr);
  const col  = name ? TEAMS[name] : (opp || DEFT);
  const raw  = (abbr||"").toString().trim();
  const chip = (name||opp) ? col.a : (normT(raw).slice(0,4).toUpperCase() || "—");
  const display = name || (opp && opp.n) || titleCase(raw) || "Team";
  const ball = poss ? ' <span class="poss" title="Has the ball">🏈</span>' : '';
  return `<div class="team ${lead?'lead':(score!=null?'trail':'')}">
    <div class="logo" style="background:${col.c};color:${col.t}">${esc(chip)}</div>
    <div><div class="tname">${esc(display)}${ball}</div></div>
    <div class="score">${score==null?"–":score}</div>
  </div>`;
}
// normalize an OCR/team string: lowercase, letters+digits only
const normT = s => (s||"").toString().toLowerCase().replace(/[^a-z0-9]/g,"");
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
const sim=(a,b)=>{const L=Math.max(a.length,b.length);return L?1-lev(a,b)/L:0;};
// map an OCR'd team string back to a roster team name (space-insensitive, fuzzy)
function nameFromAbbr(ab){
  const o = normT(ab);
  if(!o) return null;
  for(const [name,v] of Object.entries(TEAMS)){
    const n = normT(name), a = normT(v.a);
    if(o===n || o===a) return name;
    if(n.length>=4 && o.includes(n)) return name;
    if(a.length>=4 && o.includes(a)) return name;
  }
  if(o.length>=6){
    let best=null, bs=0;
    for(const name of Object.keys(TEAMS)){ const nn=normT(name); if(nn.length<8 || Math.abs(o.length-nn.length)>2 || nn.startsWith(o)) continue; const s=sim(o,nn); if(s>bs){bs=s;best=name;} }
    if(bs>=0.62) return best;
  }
  return null;
}
function fullFromAbbr(ab){ return nameFromAbbr(ab); }

// Resolve a non-roster FBS opponent (Michigan, Ohio State, …) to its color entry.
function resolveOpp(ab){
  const o = normT(ab);
  if(!o) return null;
  if(OPP[o]) return OPP[o];
  if(OPP_ALIAS[o]) return OPP[OPP_ALIAS[o]];
  for(const k in OPP){ if(k.length>=5 && (o.includes(k)||k.includes(o))) return OPP[k]; }
  if(o.length>=5){ let best=null,bs=0,second=0; for(const k in OPP){ if(k.length<6 || Math.abs(o.length-k.length)>2 || k.startsWith(o)) continue; const s=sim(o,k); if(s>bs){second=bs;bs=s;best=OPP[k];} else if(s>second){second=s;} } if(best && bs>=0.6 && (bs-second)>=0.08) return best; }
  return null;
}
// color entry for any team string: roster team, else FBS opponent, else neutral.
function colorFor(abbr){ const n=nameFromAbbr(abbr); if(n) return TEAMS[n]; return resolveOpp(abbr) || DEFT; }

    return;
  }
  $("#final").innerHTML = `<p class="section-note">${finals.length} game${finals.length>1?'s':''} final · kept 48 hours</p>`
    + `<div class="grid">${finals.map(finalCard).join("")}</div>`
    + `<div class="clearrow"><button class="clearall" onclick="clearAllFinals()">🗑 Clear all finals</button></div>`;
}

async function clearAllFinals(){
  if(!confirm("Clear ALL final scores? Use this when rolling to a new week.")) return;
  const r = await pwFetch("/api/finals","DELETE");
  if(r) refresh();
}

function finalCard(g){
  const aT = colorFor(g.away);
  const hT = colorFor(g.home);
  const aLead=(g.awayScore??0)>(g.homeScore??0), hLead=(g.homeScore??0)>(g.awayScore??0);
  return `<div class="game">
    <div class="stripe" style="background:linear-gradient(90deg,${aT.c} 50%, ${hT.c} 50%)"></div>
    <div class="top"><span class="badge-final">FINAL</span><span class="eyes">${fmtAgo(g.endedAt)}</span></div>
    <div class="rows">
      ${teamRow(g.away, aT, g.awayScore, aLead)}
      ${teamRow(g.home, hT, g.homeScore, hLead)}
    </div>
    <div class="foot"><span class="who">${esc(g.coach)}${g.team?` · ${esc(g.team)}`:""}</span>
      <div class="btns"><button class="edit" onclick="editFinal('${esc(g.id)}','${esc(g.coach)}')">✎ edit</button></div>
    </div>
  </div>`;
}

async function editFinal(id, coach){
  const cur = prompt(`Final score for ${coach}.\nFormat: awayAbbr awayScore homeAbbr homeScore\nExample: GASO 21 APP 17\n(leave blank to remove this game)`, "");
  if(cur===null) return;
  if(cur.trim()===""){ const r=await pwFetch("/api/final/"+encodeURIComponent(id),"DELETE"); if(r) refresh(); return; }
  const p=cur.trim().split(/\s+/);
  const r=await pwFetch("/api/final/"+encodeURIComponent(id),"POST",{away:p[0],awayScore:p[1],home:p[2],homeScore:p[3]});
  if(r) refresh();
}

// ---------- manual score ----------
async function editScore(twitch, coach){
  const cur = prompt(`Enter the score for ${coach}.\nFormat: awayAbbr awayScore homeAbbr homeScore quarter clock\nExample: JMU 0 DEL 7 1ST 3:18\n(leave blank to clear)`, "");
  if(cur===null) return;
  if(cur.trim()===""){ const r=await pwFetch("/api/score/"+encodeURIComponent(twitch),"DELETE"); if(r) refresh(); return; }
  const p=cur.trim().split(/\s+/);
  const r=await pwFetch("/api/score/"+encodeURIComponent(twitch),"POST",{away:p[0],awayScore:p[1],home:p[2],homeScore:p[3],quarter:p[4],clock:p[5],coach});
  if(r) refresh();
}

async function refresh(){
  try{ await Promise.all([renderLive(), renderFinal()]); }
  catch(e){ $("#sub").textContent="Connection issue — retrying…"; }
}
loadMembers().then(refresh);
setInterval(refresh, 20000);
</script>
</body>
</html>
